name: Package

# Builds a ready-to-upload copy of the app (with vendor/ and the Filament assets) for
# hosting without Composer, e.g. cPanel File Manager. Download it from the run's
# "Artifacts" section, upload and extract it on the server. See docs/deploy-cpanel.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, intl, bcmath
          coverage: none

      # Platform PHP 8.3: the package runs on 8.3 or newer.
      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build the package
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan filament:assets
          rm .env
          mkdir -p ../package
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'node_modules' \
            --exclude 'storage/logs/*.log' --exclude 'storage/framework/views/*.php' \
            --exclude 'bootstrap/cache/*.php' ./ ../package/touro_myat/
          cd ../package && zip -qr touro_myat.zip touro_myat

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: touro_myat-${{ github.sha }}
          path: ../package/touro_myat.zip
          retention-days: 14
