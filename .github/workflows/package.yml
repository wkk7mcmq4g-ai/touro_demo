name: Package

# Builds a ready-to-upload copy of the app (with vendor/ and the Filament assets) for
# hosting without Composer, e.g. cPanel File Manager. Download it from the run's
# "Artifacts" section, upload and extract it on the server. See docs/deploy-cpanel.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      # Set in GitHub → Settings → Secrets and variables → Actions (see docs/deploy-cpanel.md).
      # Without them the deploy step is skipped and only the zip is built.
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, intl, bcmath
          coverage: none

      # Platform PHP 8.3: the package runs on 8.3 or newer.
      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build the package
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan filament:assets
          rm .env
          mkdir -p "$RUNNER_TEMP/package"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'node_modules' \
            --exclude 'storage/logs/*.log' --exclude 'storage/framework/views/*.php' \
            --exclude 'bootstrap/cache/config.php' --exclude 'bootstrap/cache/routes-*.php' --exclude 'bootstrap/cache/events.php' ./ "$RUNNER_TEMP/package/touro_demo/"
          cd "$RUNNER_TEMP/package" && zip -qr touro_demo.zip touro_demo

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: touro_demo-${{ github.sha }}
          path: ${{ runner.temp }}/package/touro_demo.zip
          retention-days: 14

      # One zip over FTPS, then the server unpacks it (public/deploy.php, protected by
      # DEPLOY_TOKEN in the server's .env). Much faster than sending ~20,000 files one by one.
      # The server's .env and storage/ are never touched.
      - name: Deploy to the test site
        if: env.FTP_SERVER != '' && github.ref == 'refs/heads/main'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then echo "::warning::DEPLOY_TOKEN secret not set; skipping deploy"; exit 0; fi
          if [ -z "$DEPLOY_URL" ]; then echo "::warning::DEPLOY_URL variable not set (e.g. https://new.demo.touro.gr/deploy.php); skipping deploy"; exit 0; fi
          curl --fail --show-error --silent --ssl-reqd --retry 3 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T "$RUNNER_TEMP/package/touro_demo.zip" "ftp://$FTP_SERVER/deploy-package.zip"
          curl --fail --show-error --silent --max-time 600 -X POST \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" "$DEPLOY_URL"
